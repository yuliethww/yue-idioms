<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi rincón de palabras</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe0;--card:#fffaf0;--ink:#38432f;--soft:#6f7a66;--sage:#9caf88;--sage-d:#5b7249;--sage-l:#e3ead6;--line:#e4dac3;--shadow:0 3px 12px rgba(91,114,73,.14);--danger:#a8523f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#232820;--card:#2e342a;--ink:#efe6d2;--soft:#b3b9a5;--sage-d:#8fae78;--sage-l:#3a4434;--line:#434a3b;--shadow:0 3px 12px rgba(0,0,0,.3);--danger:#e08c78}}
:root[data-theme="dark"]{--bg:#232820;--card:#2e342a;--ink:#efe6d2;--soft:#b3b9a5;--sage-d:#8fae78;--sage-l:#3a4434;--line:#434a3b;--shadow:0 3px 12px rgba(0,0,0,.3);--danger:#e08c78}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}h1{font-size:1.8rem}
.ic{width:18px;height:18px;flex:none}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;background:var(--sage-l);color:var(--ink);font-weight:700;display:inline-flex;gap:7px;align-items:center;justify-content:center;transition:.15s}
button:hover{filter:brightness(.96);transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sage-d);outline-offset:1px}
.pri{background:var(--sage-d);color:#fffaf0}.dng{background:var(--danger);color:#fff}
.gh{background:transparent;border:1.5px solid var(--line)}
.ib{padding:7px;background:transparent;color:var(--soft)}.ib:hover{background:var(--sage-l);color:var(--ink)}
.ib.on{color:var(--sage-d);background:var(--sage-l)}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
label{display:block;font-weight:700;font-size:.82rem;color:var(--soft);margin:12px 0 5px}
.err{color:var(--danger);font-size:.82rem;margin-top:4px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
#side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.logo{font-family:Fraunces,serif;font-size:1.25rem;font-weight:700;padding:4px 10px 16px}
.nv{justify-content:flex-start;background:transparent;width:100%;font-weight:600;color:var(--soft)}
.nv.on{background:var(--sage-l);color:var(--ink)}
.sec{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);padding:14px 10px 4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.col{min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;padding:12px 22px;background:var(--bg);border-bottom:1px solid var(--line);padding-top:max(12px,env(safe-area-inset-top,0px))}
.sb{position:relative;flex:1}.sb .ic{position:absolute;left:11px;top:11px;color:var(--soft)}.sb input{padding-left:36px}
main{padding:22px;max-width:980px;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sub{color:var(--soft);margin:3px 0 18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 1.6rem Fraunces,serif;color:var(--sage-d)}.stat span{color:var(--soft);font-size:.82rem}
.hd{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.lc{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border-top:7px solid var(--c);padding:16px;cursor:pointer;position:relative;transition:.2s}
.lc:hover{transform:translateY(-3px)}
.lc .nat{font:700 1.45rem Fraunces,serif}.lc small{color:var(--soft)}
.lc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.lc .cnt{font-weight:700;color:var(--sage-d)}
.lc .mb{position:absolute;top:10px;right:8px}
.menu{position:absolute;top:42px;right:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:5px;z-index:4;min-width:170px;animation:fade .15s}
.menu button{width:100%;justify-content:flex-start;background:transparent;font-weight:600}
.nl{border:2px dashed var(--sage);background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;min-height:130px;color:var(--sage-d);font-weight:700;gap:6px}
.wr{display:flex;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.t{font-weight:700;font-size:1.05rem}.pr{color:var(--soft);font-size:.88rem}.m{color:var(--ink)}
.exm{color:var(--soft);font-style:italic;font-size:.9rem}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--sage-l);color:var(--sage-d)}
.chip.b{border:1.5px solid var(--line);background:none;color:var(--soft);cursor:pointer;padding:2px 9px}.chip.b.on{background:var(--sage-d);color:#fffaf0;border-color:var(--sage-d)}
.act{display:flex;align-items:flex-start;flex:none}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}.end{justify-content:flex-end;margin-top:16px}
.panel{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.empty{text-align:center;padding:36px 16px;color:var(--soft);background:var(--card);border-radius:18px;border:2px dashed var(--line)}
.empty .em{font-size:2.2rem}.empty h3{color:var(--ink);margin:6px 0}.empty button{margin-top:12px}
.spin{width:30px;height:30px;border:4px solid var(--sage-l);border-top-color:var(--sage-d);border-radius:50%;animation:sp .8s linear infinite;margin:70px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(40,46,34,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20;animation:fade .15s}
.ov.t2{z-index:30}
.md{background:var(--bg);border-radius:20px;padding:20px;width:100%;max-width:540px;max-height:92vh;overflow:auto;animation:fade .2s}.md.sm{max-width:380px}
.tabs{display:flex;background:var(--sage-l);border-radius:12px;padding:3px;margin:12px 0}.tabs button{flex:1;background:transparent}.tabs .on{background:var(--card);box-shadow:var(--shadow)}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent;padding:0}.sw.on{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{background:var(--card);border-radius:22px;box-shadow:var(--shadow);min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;cursor:pointer;border-top:8px solid var(--c)}
.fc .big{font:700 2rem Fraunces,serif}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center}
.ts{background:var(--sage-d);color:#fffaf0;padding:9px 16px;border-radius:99px;font-weight:700;animation:fade .2s;box-shadow:var(--shadow)}.ts.e{background:var(--danger)}
#bnav{display:none}
@media(max-width:760px){
.shell{display:block}#side{display:none}.stats{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}.tools>:first-child{grid-column:1/-1}
.top,main{padding-left:14px;padding-right:14px}.pri span{display:none}
#bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#bnav button{flex:1;flex-direction:column;gap:2px;font-size:.72rem;background:transparent;color:var(--soft);padding:6px}#bnav .on{color:var(--sage-d)}
main{padding-bottom:90px}#toast{bottom:90px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="shell"><aside id="side"></aside><div class="col">
<header class="top"><div class="sb"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input id="gq" placeholder="Buscar en todas tus palabras…" aria-label="Buscar" oninput="S.q=this.value;renderMain()"></div>
<button class="pri" onclick="openWord()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Añadir palabra</span></button></header>
<main id="main"><div class="spin"></div></main></div></div>
<nav id="bnav"></nav><div id="modal"></div><div id="toast"></div>
<script>
const IC={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',cards:'<rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 3h12a2 2 0 012 2v12"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',plus:'<path d="M12 5v14M5 12h14"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',moon:'<path d="M20 14A8 8 0 1110 4a7 7 0 0010 10z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12l5 5 9-10"/>',back:'<path d="M15 5l-7 7 7 7"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',undo:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const COLORS=["#9caf88","#c9b27c","#d4a59a","#8fa8a3","#b9a0c4","#a3b57c"];
const LANGS=[["Español","Español"],["Inglés","English"],["Italiano","Italiano"],["Ruso","Русский"],["Cantonés","粵語"],["Mandarín","普通话"],["Francés","Français"],["Alemán","Deutsch"],["Japonés","日本語"],["Coreano","한국어"],["Portugués","Português"]];
let S={lib:{folders:[]},view:'home',fid:null,q:'',lq:'',sort:'recent',tag:'',sub:'',st:'all',menu:null,modal:null,cf:null,cloud:false,loading:true,deck:[],di:0,flip:false,ref:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fl=()=>S.lib.folders.filter(f=>!f.deletedAt),ws=f=>f.words.filter(w=>!w.deletedAt);
const allw=()=>fl().flatMap(f=>ws(f).map(w=>({w,f})));
const trs=w=>w.tr&&w.tr.length?w.tr:(w.meaning?[w.meaning]:[]);
const fF=id=>S.lib.folders.find(f=>f.id===id),fW=(f,id)=>f.words.find(w=>w.id===id);
const match=(w,q)=>[w.term,...trs(w),w.pron,w.notes,...(w.tags||[]),...(w.ex||[])].join(' ').toLowerCase().includes(q.toLowerCase());
const plural=(n,a,b)=>`${n} ${n==1?a:b}`;

function toast(m,e){const d=document.createElement('div');d.className='ts'+(e?' e':'');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),2600)}
let chain=Promise.resolve(),lsOk=true;
function save(){
  S.lib.updatedAt=Date.now();const snap=JSON.parse(JSON.stringify(S.lib));
  try{localStorage.setItem('lib',JSON.stringify(snap))}catch(x){lsOk=false}
  if(S.cloud&&S.ref){chain=chain.then(()=>S.ref.set(snap)).catch(x=>{S.err=(x&&(x.code||x.message))||'error';toast('No se pudo guardar en tu cuenta: '+S.err,1);render()})}
  else if(!lsOk)toast('No se pudo guardar: este navegador bloquea el almacenamiento',1)
}
async function init(){
  let th;try{th=localStorage.getItem('th')}catch(e){}if(th)document.documentElement.dataset.theme=th;
  render();
  let loc=null;try{const l=localStorage.getItem('lib');if(l)loc=JSON.parse(l)}catch(e){}
  try{if(typeof claude==='undefined')throw 0;const db=await claude.use('db'),u=await claude.use('user');
    if(!db||!u)S.err='sin sesión';
    else{const id=await u.id();if(!id)S.err='sin sesión';else{S.ref=db.collection('data/users/'+id).doc('library');S.cloud=true;
      try{const s=await S.ref.get();if(s.exists&&s.data().folders)S.lib=s.data()}catch(e){S.err=(e&&(e.code||e.message))||'error de lectura'}}}}catch(e){S.err=e?(e.code||e.message||'error'):''}
  if(loc&&loc.folders&&(!S.lib.folders.length||(loc.updatedAt||0)>(S.lib.updatedAt||0))){S.lib=loc;if(S.cloud)setTimeout(save,0)}
  S.lib.folders.forEach(f=>{f.words=f.words||[];f.native=f.native||f.name});
  S.loading=false;render();
}
function toggleTheme(){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('th',r.dataset.theme)}catch(e){}}
function go(v,fid){Object.assign(S,{view:v,fid:fid||null,q:'',lq:'',tag:'',sub:'',st:'all',menu:null});$('#gq').value='';render();scrollTo(0,0)}
function render(){
  const N=[['home','Inicio','home'],['cards','Repasar','cards'],['trash','Papelera','trash']];
  const on=v=>S.view===v&&!(v==='home'&&S.fid)?'on':'';
  $('#side').innerHTML=`<div class="logo">🌿 Mi rincón</div>`+N.map(([v,l,i])=>`<button class="nv ${on(v)}" onclick="go('${v}')">${ic(i)}${l}</button>`).join('')+
   `<div class="sec">Idiomas</div>`+fl().map(f=>`<button class="nv ${S.fid===f.id?'on':''}" style="--c:${f.color}" onclick="go('lang','${f.id}')"><span class="dot"></span>${esc(f.native)}</button>`).join('')+
   `<button class="nv" onclick="openLang()">${ic('plus')}Nuevo idioma</button><div style="flex:1"></div><button class="nv" onclick="toggleTheme()">${ic('moon')}Tema claro / oscuro</button><div class="pr" style="padding:6px 10px">${S.cloud&&!S.err?'☁️ Guardado en tu cuenta':'Guardado solo en este navegador'}${S.err?`<br><small>(${esc(S.err)})</small>`:''}</div>`;
  $('#bnav').innerHTML=N.map(([v,l,i])=>`<button class="${on(v)}" onclick="go('${v}')">${ic(i)}${l}</button>`).join('')+`<button onclick="toggleTheme()">${ic('moon')}Tema</button>`;
  renderMain();
}
function renderMain(){
  const m=$('#main');
  if(S.loading){m.innerHTML='<div class="spin" role="status" aria-label="Cargando"></div>';return}
  if(S.q.trim())m.innerHTML=results();
  else if(S.view==='lang'&&fF(S.fid)&&!fF(S.fid).deletedAt){m.innerHTML=langView(fF(S.fid));fill(fF(S.fid))}
  else if(S.view==='trash')m.innerHTML=trashView();
  else if(S.view==='cards')m.innerHTML=cardsView();
  else m.innerHTML=home();
}
const empty=(em,t,p,b)=>`<div class="empty"><div class="em">${em}</div><h3>${t}</h3><p>${p}</p>${b||''}</div>`;
function wr(w,f,lang){const t=trs(w);
  return `<div class="wr"><div><div><span class="t">${esc(w.term)}</span> ${w.pron?`<span class="pr">/${esc(w.pron)}/</span>`:''}</div><div class="m">${t.map(esc).join(' · ')}</div>${(w.ex||[])[0]?`<div class="exm">“${esc(w.ex[0])}”</div>`:''}
  <div class="chips">${lang?`<span class="chip">${esc(f.native)}</span>`:''}${w.sub?`<span class="chip">📁 ${esc(w.sub)}</span>`:''}${(w.tags||[]).map(x=>`<span class="chip">#${esc(x)}</span>`).join('')}</div></div>
  <div class="act"><button class="ib ${w.learned?'on':''}" title="Marcar como aprendida" aria-label="Marcar como aprendida" onclick="toggleL('${f.id}','${w.id}')">${ic('check')}</button><button class="ib" title="Editar" aria-label="Editar" onclick="openWord('${f.id}','${w.id}')">${ic('edit')}</button><button class="ib" title="Mover a la papelera" aria-label="Mover a la papelera" onclick="trashW('${f.id}','${w.id}')">${ic('trash')}</button></div></div>`}
function home(){
  const A=allw(),wk=Date.now()-6048e5,rec=[...A].sort((a,b)=>(b.w.at||0)-(a.w.at||0)).slice(0,5);
  return `<h1>Tu rincón de palabras</h1><p class="sub">Guarda, repasa y ordena el vocabulario de cada idioma.</p>
  <div class="stats">${[[A.length,'palabras'],[fl().length,'idiomas'],[A.filter(x=>x.w.at>wk).length,'nuevas esta semana'],[A.filter(x=>x.w.learned).length,'aprendidas']].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
  <div class="hd"><h2>Tus idiomas</h2></div>
  <div class="grid">${fl().map(f=>`<div class="lc" style="--c:${f.color}" onclick="go('lang','${f.id}')"><button class="ib mb" aria-label="Opciones" onclick="menuT('${f.id}',event)">${ic('more')}</button>
  ${S.menu===f.id?`<div class="menu" onclick="event.stopPropagation()"><button onclick="openLang('${f.id}')">${ic('edit')}Editar idioma</button><button onclick="study('${f.id}')">${ic('cards')}Repasar</button><button style="color:var(--danger)" onclick="trashF('${f.id}')">${ic('trash')}Mover a la papelera</button></div>`:''}
  <div class="nat">${esc(f.native)}</div><small>${esc(f.name)}</small><div class="ft"><span class="cnt">${plural(ws(f).length,'palabra','palabras')}</span><span class="pr">Abrir →</span></div></div>`).join('')}
  <button class="lc nl" onclick="openLang()">${ic('plus')}Nuevo idioma</button></div>
  ${fl().length?`<div class="hd"><h2>Añadidas recientemente</h2></div>${rec.length?rec.map(x=>wr(x.w,x.f,1)).join(''):empty('✍️','Aún no hay palabras','Añade la primera con el botón de arriba.')}`:''}`}
function results(){
  const r=allw().filter(x=>match(x.w,S.q.trim()));
  return `<div class="hd"><h2>Resultados para “${esc(S.q.trim())}”</h2><button class="gh" onclick="$('#gq').value='';S.q='';renderMain()">Limpiar</button></div>`+(r.length?r.map(x=>wr(x.w,x.f,1)).join(''):empty('🔍','Nada coincide','Prueba con otra palabra, traducción o etiqueta.'))}
function langView(f){
  const W=ws(f),subs=[...new Set(W.map(w=>w.sub).filter(Boolean))],tags=[...new Set(W.flatMap(w=>w.tags||[]))];
  return `<button class="gh" onclick="go('home')">${ic('back')}Inicio</button>
  <div class="hd"><div><h1 style="color:${f.color}">${esc(f.native)}</h1><div class="sub" style="margin:0">${esc(f.name)} · ${plural(W.length,'palabra','palabras')}</div></div><button class="pri" onclick="openWord('${f.id}')">${ic('plus')}Añadir</button></div>
  ${subs.length?`<div class="chips" style="margin:0 0 6px"><button class="chip b ${S.sub?'':'on'}" onclick="S.sub='';renderMain()">Todas</button>${subs.map(s=>`<button class="chip b ${S.sub===s?'on':''}" onclick="S.sub=this.dataset.s;renderMain()" data-s="${esc(s)}">📁 ${esc(s)}</button>`).join('')}</div>`:''}
  <div class="tools"><input id="lq" value="${esc(S.lq)}" placeholder="Buscar en ${esc(f.native)}…" aria-label="Buscar en este idioma" oninput="S.lq=this.value;fill(fF(S.fid))">
  <select aria-label="Ordenar" onchange="S.sort=this.value;renderMain()"><option value="recent" ${S.sort=='recent'?'selected':''}>Más recientes</option><option value="az" ${S.sort=='az'?'selected':''}>A–Z</option></select>
  <select aria-label="Estado" onchange="S.st=this.value;renderMain()"><option value="all">Todas</option><option value="learned" ${S.st=='learned'?'selected':''}>Aprendidas</option><option value="new" ${S.st=='new'?'selected':''}>Por aprender</option></select>
  <select aria-label="Etiqueta" onchange="S.tag=this.value;renderMain()"><option value="">Todas las etiquetas</option>${tags.map(t=>`<option ${S.tag===t?'selected':''} value="${esc(t)}">#${esc(t)}</option>`).join('')}</select></div><div id="wl"></div>`}
function fill(f){
  const el=$('#wl');if(!el)return;
  let L=ws(f).filter(w=>(!S.lq||match(w,S.lq))&&(!S.tag||(w.tags||[]).includes(S.tag))&&(!S.sub||w.sub===S.sub)&&(S.st==='all'||(S.st==='learned')===!!w.learned));
  L.sort(S.sort==='az'?(a,b)=>a.term.localeCompare(b.term):(a,b)=>(b.at||0)-(a.at||0));
  el.innerHTML=L.length?L.map(w=>wr(w,f)).join(''):ws(f).length?empty('🔍','Nada coincide','Cambia los filtros o la búsqueda.'):empty('☕','Esta carpeta está vacía','Agrega tu primera palabra en '+esc(f.native)+'.',`<button class="pri" onclick="openWord('${f.id}')">${ic('plus')}Añadir palabra</button>`)}
function trashView(){
  const F=S.lib.folders.filter(f=>f.deletedAt),W=fl().flatMap(f=>f.words.filter(w=>w.deletedAt).map(w=>({w,f})));
  const row=(t,s,r,d)=>`<div class="wr"><div><div class="t">${t}</div><div class="pr">${s}</div></div><div class="act"><button class="ib" onclick="${r}">${ic('undo')}Restaurar</button><button class="ib" style="color:var(--danger)" onclick="${d}">${ic('x')}Eliminar</button></div></div>`;
  return `<h1>Papelera</h1><p class="sub">Lo que borres se queda aquí hasta que lo elimines para siempre.</p>`+(F.length+W.length?
   F.map(f=>row(esc(f.native),`Idioma · ${plural(f.words.length,'palabra','palabras')}`,`restoreF('${f.id}')`,`delF('${f.id}')`)).join('')+W.map(({w,f})=>row(esc(w.term),esc(f.native),`restoreW('${f.id}','${w.id}')`,`delW('${f.id}','${w.id}')`)).join(''):empty('🧺','La papelera está vacía','Nada que restaurar por ahora.'))}
function cardsView(){
  const sc=S.fsc||'all';
  if(S.deck.length&&S.di<S.deck.length){const d=S.deck[S.di],f=fF(d.f),w=f&&fW(f,d.w);if(w)return `<h1>Repasar</h1><p class="sub">Tarjeta ${S.di+1} de ${S.deck.length}</p>
   <div class="fc" style="--c:${f.color}" onclick="S.flip=!S.flip;renderMain()">${S.flip?`<div class="big">${trs(w).map(esc).join(' · ')}</div>${(w.ex||[])[0]?`<p class="exm">“${esc(w.ex[0])}”</p>`:''}`:`<div class="big">${esc(w.term)}</div>${w.pron?`<div class="pr">/${esc(w.pron)}/</div>`:''}<p class="pr">Toca para ver la traducción</p>`}</div>
   <div class="row end" style="justify-content:center"><button class="gh" onclick="nextC(0)">${ic('undo')}Otra vez</button><button class="pri" onclick="nextC(1)">${ic('check')}Ya la sé</button><button class="gh" onclick="S.deck=[];renderMain()">Terminar</button></div>`}
  const n=allw().length;
  return `<h1>Repasar</h1><p class="sub">${S.deck.length?'¡Terminaste este repaso! 🎉':'Practica con tarjetas de tus propias palabras.'}</p>`+(n?`<div class="panel" style="max-width:380px"><label>Idioma</label><select onchange="S.fsc=this.value"><option value="all">Todos</option>${fl().map(f=>`<option value="${f.id}" ${sc===f.id?'selected':''}>${esc(f.native)}</option>`).join('')}</select><button class="pri" style="margin-top:14px" onclick="study(S.fsc||'all')">Empezar repaso</button></div>`:empty('🃏','Aún no hay palabras','Añade vocabulario para poder repasarlo.'))}
function study(id){
  let A=allw().filter(x=>id==='all'||x.f.id===id);const nl=A.filter(x=>!x.w.learned);if(nl.length)A=nl;
  if(!A.length){toast('Añade palabras primero',1);return}
  S.deck=A.map(x=>({f:x.f.id,w:x.w.id})).sort(()=>Math.random()-.5);S.di=0;S.flip=false;go('cards');S.menu=null;renderMain()}
function nextC(k){const d=S.deck[S.di];if(k){const w=fW(fF(d.f),d.w);w.learned=true;save()}S.di++;S.flip=false;renderMain()}
function menuT(id,e){e.stopPropagation();S.menu=S.menu===id?null:id;renderMain()}
document.addEventListener('click',()=>{if(S.menu){S.menu=null;renderMain()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.cf)S.cf=null;else S.modal=null;renderModal()}});
function toggleL(f,w){const x=fW(fF(f),w);x.learned=!x.learned;save();renderMain();toast(x.learned?'Marcada como aprendida':'Vuelve a estar por aprender')}
function trashW(f,w){fW(fF(f),w).deletedAt=Date.now();save();renderMain();toast('Movida a la papelera')}
function restoreW(f,w){delete fW(fF(f),w).deletedAt;save();renderMain();toast('Palabra restaurada')}
function restoreF(f){delete fF(f).deletedAt;save();render();toast('Idioma restaurado')}
function ask(msg,btn,fn){S.cf={msg,btn,fn:()=>{S.cf=null;fn();renderModal()}};renderModal()}
function trashF(id){S.menu=null;const f=fF(id);ask(`¿Mover “${esc(f.native)}” y sus ${ws(f).length} palabras a la papelera? Podrás restaurarlo.`,'Mover',()=>{f.deletedAt=Date.now();save();go('home');toast('Idioma movido a la papelera')})}
function delF(id){ask('Se eliminará para siempre junto con todas sus palabras.','Eliminar',()=>{S.lib.folders=S.lib.folders.filter(f=>f.id!==id);save();renderMain();render()})}
function delW(f,w){ask('Esta palabra se eliminará para siempre.','Eliminar',()=>{const F=fF(f);F.words=F.words.filter(x=>x.id!==w);save();renderMain()})}
/* ---------- modales ---------- */
function renderModal(){
  let h='';if(S.modal)h+=S.modal.t==='word'?wordModal():langModal();
  if(S.cf)h+=`<div class="ov t2"><div class="md sm" role="alertdialog"><p>${S.cf.msg}</p><div class="row end"><button class="gh" onclick="S.cf=null;renderModal()">Cancelar</button><button class="dng" onclick="S.cf.fn()">${S.cf.btn}</button></div></div></div>`;
  $('#modal').innerHTML=h;const f=$('#modal [autofocus]');if(f)f.focus()}
const lopts=sel=>LANGS.map(([n,t])=>`<option value="${n}" ${n===sel?'selected':''}>${t} (${n})</option>`).join('')+(LANGS.some(l=>l[0]===sel)?'':`<option selected>${esc(sel)}</option>`);
function openWord(fid,wid){
  if(!fl().length){toast('Primero crea un idioma');openLang();return}
  const f=fF(fid)||fF(S.fid)&&!fF(S.fid).deletedAt&&fF(S.fid)||fl()[0],w=wid&&fW(f,wid);
  const def=LANGS.some(l=>l[0]===f.name)?f.name:LANGS[0][0];
  S.modal={t:'word',fid:f.id,wid,mode:w&&((w.tr||[]).length>1||(w.ex||[]).length||w.pron||w.notes||(w.tags||[]).length||w.sub)?'full':'quick',err:{},
   d:w?{term:w.term,tr:[...trs(w)],ex:(w.ex||[]).length?[...w.ex]:[''],pron:w.pron||'',notes:w.notes||'',tags:(w.tags||[]).join(', '),sub:w.sub||'',from:w.from||def,to:w.to||'Español'}:{term:'',tr:[''],ex:[''],pron:'',notes:'',tags:'',sub:'',from:def,to:def==='Español'?'Inglés':'Español'}};
  if(!(S.modal.d.tr.length))S.modal.d.tr=[''];renderModal()}
function wordModal(){
  const m=S.modal,d=m.d,full=m.mode==='full',e=m.err,f=fF(m.fid),subs=[...new Set(ws(f).map(w=>w.sub).filter(Boolean))];
  const rows=(k,ph)=>d[k].map((v,i)=>`<div class="row" style="margin-bottom:6px"><input class="m_${k}" value="${esc(v)}" placeholder="${ph} ${i+1}" ${k==='tr'&&i===0?'autofocus':''}>${d[k].length>1?`<button type="button" class="ib" aria-label="Quitar" onclick="rowDel('${k}',${i})">${ic('x')}</button>`:''}</div>`).join('');
  return `<div class="ov" onmousedown="if(event.target===this){S.modal=null;renderModal()}"><div class="md" role="dialog" aria-label="Palabra">
  <div class="row" style="justify-content:space-between"><h2>${m.wid?'Editar palabra':'Añadir palabra'}</h2><button class="ib" aria-label="Cerrar" onclick="S.modal=null;renderModal()">${ic('x')}</button></div>
  <div class="tabs"><button class="${full?'':'on'}" onclick="setMode('quick')">Añadido rápido</button><button class="${full?'on':''}" onclick="setMode('full')">Ficha completa</button></div>
  <label>Idioma / colección</label><select id="m_fid">${fl().map(x=>`<option value="${x.id}" ${x.id===m.fid?'selected':''}>${esc(x.native)}</option>`).join('')}</select>
  ${full?`<div class="two"><div><label>Idioma original</label><select id="m_from">${lopts(d.from)}</select></div><div><label>Idioma de traducción</label><select id="m_to">${lopts(d.to)}</select></div></div>`:''}
  <label>Palabra</label><input id="m_term" value="${esc(d.term)}" placeholder="Palabra o expresión" ${m.wid?'':'autofocus'}>${e.term?`<div class="err">${e.term}</div>`:''}
  <label>${full?'Traducciones':'Traducción'}</label>${full?rows('tr','Traducción'):`<input class="m_tr" value="${esc(d.tr[0])}" placeholder="Significado">`}${e.tr?`<div class="err">${e.tr}</div>`:''}
  ${full?`<button type="button" class="gh" onclick="rowAdd('tr')">${ic('plus')}Otra traducción</button>
  <label>Ejemplos</label>${rows('ex','Ejemplo')}<button type="button" class="gh" onclick="rowAdd('ex')">${ic('plus')}Otro ejemplo</button>
  <div class="two"><div><label>Pronunciación</label><input id="m_pron" value="${esc(d.pron)}" placeholder="ej. ciao"></div><div><label>Subcarpeta</label><input id="m_sub" list="subs" value="${esc(d.sub)}" placeholder="ej. Viajes"><datalist id="subs">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div></div>
  <label>Etiquetas (separadas por comas)</label><input id="m_tags" value="${esc(d.tags)}" placeholder="verbo, comida"><label>Notas</label><textarea id="m_notes" rows="2">${esc(d.notes)}</textarea>`:''}
  <div class="row end"><button class="gh" onclick="S.modal=null;renderModal()">Cancelar</button><button class="pri" onclick="saveWord()">${m.wid?'Guardar cambios':'Guardar palabra'}</button></div></div></div>`}
function collect(){
  const m=S.modal,d=m.d,g=id=>{const e=$('#'+id);return e?e.value:null},qa=c=>[...document.querySelectorAll(c)].map(e=>e.value);
  const v=g('m_term');if(v!==null)d.term=v;
  const tr=qa('.m_tr');if(m.mode==='quick'){if(tr.length)d.tr[0]=tr[0]}else if(tr.length)d.tr=tr;
  const ex=qa('.m_ex');if(ex.length)d.ex=ex;
  ['pron','notes','tags','sub','from','to'].forEach(k=>{const x=g('m_'+k);if(x!==null)d[k]=x});
  const f=g('m_fid');if(f)m.fid=f}
function setMode(x){collect();S.modal.mode=x;renderModal()}
function rowAdd(k){collect();S.modal.d[k].push('');renderModal();const a=document.querySelectorAll('.m_'+k);a[a.length-1].focus()}
function rowDel(k,i){collect();const a=S.modal.d[k];a.splice(i,1);if(!a.length)a.push('');renderModal()}
function saveWord(){
  collect();const m=S.modal,d=m.d,term=d.term.trim(),tr=d.tr.map(s=>s.trim()).filter(Boolean),f=fF(m.fid);m.err={};
  if(!term)m.err.term='Escribe la palabra';else if(ws(f).some(w=>w.id!==m.wid&&w.term.toLowerCase()===term.toLowerCase()))m.err.term='Ya existe en esta colección';
  if(!tr.length)m.err.tr='Añade al menos una traducción';
  if(Object.keys(m.err).length){renderModal();return}
  const o={term,meaning:tr[0],tr,ex:d.ex.map(s=>s.trim()).filter(Boolean),pron:d.pron.trim(),notes:d.notes.trim(),tags:d.tags.split(',').map(s=>s.trim()).filter(Boolean),sub:d.sub.trim(),from:d.from,to:d.to};
  if(m.wid){const old=S.lib.folders.find(x=>fW(x,m.wid)),w=fW(old,m.wid);Object.assign(w,o);if(old!==f){old.words=old.words.filter(x=>x!==w);f.words.unshift(w)}}
  else f.words.unshift({id:uid(),at:Date.now(),learned:false,...o});
  S.modal=null;renderModal();save();renderMain();toast(m.wid?'Cambios guardados':'Palabra guardada')}
function openLang(id){const f=id&&fF(id);S.menu=null;S.modal={t:'lang',fid:id,err:'',d:f?{name:f.name,native:f.native,color:f.color}:{name:'',native:'',color:COLORS[fl().length%COLORS.length]}};renderModal()}
function langModal(){const m=S.modal,d=m.d;
  return `<div class="ov" onmousedown="if(event.target===this){S.modal=null;renderModal()}"><div class="md sm" role="dialog" aria-label="Idioma"><h2>${m.fid?'Editar idioma':'Nuevo idioma'}</h2>
  <label>Nombre (en español)</label><input id="l_name" list="ll" value="${esc(d.name)}" placeholder="ej. Italiano" onchange="langAuto()" autofocus><datalist id="ll">${LANGS.map(l=>`<option value="${l[0]}">`).join('')}</datalist>
  <label>Nombre nativo</label><input id="l_native" value="${esc(d.native)}" placeholder="ej. Italiano, 粵語, Русский">${m.err?`<div class="err">${m.err}</div>`:''}
  <label>Color</label><div class="row">${COLORS.map(c=>`<button class="sw ${c===d.color?'on':''}" style="--c:${c}" aria-label="Color" onclick="lcol('${c}')"></button>`).join('')}</div>
  <div class="row end"><button class="gh" onclick="S.modal=null;renderModal()">Cancelar</button><button class="pri" onclick="saveLang()">Guardar</button></div></div></div>`}
function lcollect(){S.modal.d.name=$('#l_name').value;S.modal.d.native=$('#l_native').value}
function langAuto(){const n=$('#l_name').value.trim(),l=LANGS.find(x=>x[0].toLowerCase()===n.toLowerCase());if(l&&!$('#l_native').value.trim())$('#l_native').value=l[1]}
function lcol(c){lcollect();S.modal.d.color=c;renderModal()}
function saveLang(){lcollect();const m=S.modal,d=m.d,name=d.name.trim(),nat=d.native.trim()||name;
  if(!name){m.err='Escribe el nombre del idioma';renderModal();return}
  if(m.fid){Object.assign(fF(m.fid),{name,native:nat,color:d.color})}else S.lib.folders.push({id:uid(),name,native:nat,color:d.color,words:[]});
  S.modal=null;renderModal();save();render();toast(m.fid?'Idioma actualizado':'Idioma creado')}
init();
</script></body></html>
