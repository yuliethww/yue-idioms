  const sb=(k,l)=>`<button class="${rs.src===k?'on':''}" onclick="S.rs.src='${k}';S.rs.f='all';renderMain()">${l}</button>`;
  const opts=['me','lib'].filter(s=>rs.src==='both'||rs.src===s).flatMap(s=>fl(s).map(f=>`<option value="${s}:${f.id}" ${rs.f===s+':'+f.id?'selected':''}>${esc(f.native)}${s==='lib'?' (Library)':''}</option>`)).join('');
  return `<h1>Review</h1><p class="sub">Practice your own words or the official library.</p><div class="panel" style="max-width:420px"><label>Source</label><div class="tabs">${sb('me','My words')}${sb('lib','Library')}${sb('both','Both')}</div>
   <label>Language</label><select onchange="S.rs.f=this.value"><option value="all">All</option>${opts}</select>
   <label>Mode</label><div class="tabs"><button class="${rs.mode=='flash'?'on':''}" onclick="S.rs.mode='flash';renderMain()">Flashcards</button><button class="${rs.mode=='quiz'?'on':''}" ${q?'':'disabled'} onclick="S.rs.mode='quiz';renderMain()">Multiple choice</button></div>${q?'':`<p class="pr">🔒 Multiple choice needs at least 4 words in this source (${n}/4).</p>`}
   <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${rs.hard?'checked':''} onchange="S.rs.hard=this.checked"> Only hard words ⭐</label>
   <button class="pri" style="margin-top:14px;width:100%" onclick="startRev()">Start review</button></div>`}
function menuT(id,e){e.stopPropagation();S.menu=S.menu===id?null:id;renderMain()}
document.addEventListener('click',()=>{if(S.menu){S.menu=null;renderMain()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){S.sheet=0;if(S.cf)S.cf=null;else S.modal=null;renderModal()}});
function toggleL(f,w){const x=P(fW(fF(f),w),1);x.learned=!x.learned;save();renderMain();toast(x.learned?'Marked as learned':'Back to “to learn”')}
function toggleS(f,w){const x=P(fW(fF(f),w),1);x.star=!x.star;save();renderMain();toast(x.star?'Marked as hard ⭐':'Removed from hard words')}
function ask(msg,btn,fn){S.cf={msg,btn,fn:()=>{S.cf=null;fn();renderModal()}};renderModal()}
function delF(id){S.menu=null;const f=fF(id),lib=S.sc==='lib';ask(`Delete “${esc(f.native)}” and its ${ws(f).length} words forever? ${lib?'This removes it for every user. ':''}This can’t be undone.`,'Delete',()=>{D().folders=D().folders.filter(x=>x.id!==id);if(lib)FB.libDel(id).catch(e=>toast('Could not delete: '+(e.code||e.message),1));else save();go(lib?'lib':'home');toast('Language deleted')})}
function delW(f,w){ask('Delete this word forever?','Delete',()=>{const F=fF(f);F.words=F.words.filter(x=>x!==w);persist(F);renderMain();toast('Word deleted')})}
/* ---------- subfolders ---------- */
function openSub(fid,ren){S.modal={t:'sub',fid,old:ren?S.sub:'',name:ren?S.sub:'',err:''};renderModal()}
function subModal(){const m=S.modal;return `<div class="ov" onmousedown="if(event.target===this){S.modal=null;renderModal()}"><div class="md sm" role="dialog" aria-label="Subfolder"><h2>${m.old?'Rename subfolder':'New subfolder'}</h2>
  <label>Name</label><input id="s_name" value="${esc(m.name)}" placeholder="e.g. Clothes, Vegetables" autofocus onkeydown="if(event.key==='Enter')saveSub()">${m.err?`<div class="err">${m.err}</div>`:''}
  <div class="row end"><button class="gh" onclick="S.modal=null;renderModal()">Cancel</button><button class="pri" onclick="saveSub()">Save</button></div></div></div>`}
function saveSub(){const m=S.modal,f=fF(m.fid),n=$('#s_name').value.trim();m.name=n;f.subs=f.subs||[];
  if(!n){m.err='Enter a name';renderModal();return}
  if(f.subs.some(s=>s.toLowerCase()===n.toLowerCase()&&s!==m.old)){m.err='That subfolder already exists';renderModal();return}
  if(m.old){f.subs[f.subs.indexOf(m.old)]=n;f.words.forEach(w=>{if(w.sub===m.old)w.sub=n});S.sub=n}else f.subs.push(n);
  S.modal=null;renderModal();persist(f);renderMain();toast(m.old?'Subfolder renamed':'Subfolder created')}
function delSub(fid){const f=fF(fid),s=S.sub;ask(`Delete the subfolder “${esc(s)}”? Its words stay in ${esc(f.native)}, just without a subfolder.`,'Delete',()=>{f.subs=f.subs.filter(x=>x!==s);f.words.forEach(w=>{if(w.sub===s)w.sub=''});S.sub='';persist(f);renderMain();toast('Subfolder deleted')})}
/* ---------- modals ---------- */
function renderModal(){
  let h='';if(S.modal)h+=S.modal.t==='word'?wordModal():S.modal.t==='lang'?langModal():subModal();
  if(S.cf)h+=`<div class="ov t2"><div class="md sm" role="alertdialog"><p>${S.cf.msg}</p><div class="row end"><button class="gh" onclick="S.cf=null;renderModal()">Cancel</button><button class="dng" onclick="S.cf.fn()">${S.cf.btn}</button></div></div></div>`;
  if(S.sheet)h+=`<div class="ov sh" onmousedown="if(event.target===this){S.sheet=0;renderModal()}"><div class="md sm" role="dialog" aria-label="More"><button class="nv" onclick="S.sheet=0;renderModal();S.rs.hard=true;startRev('all');S.rs.hard=false">${ic('star')}Review hard words</button><button class="nv" onclick="S.sheet=0;renderModal();toggleTheme()">${ic('moon')}Light / dark mode</button><button class="nv" onclick="S.sheet=0;renderModal();account()">${ic('user')}${S.user?'Sign out':'Sign in'}</button></div></div>`;
  $('#modal').innerHTML=h;const f=$('#modal [autofocus]');if(f)f.focus()}
const lopts=sel=>LANGS.map(([n,t])=>`<option value="${n}" ${n===sel?'selected':''}>${t} (${n})</option>`).join('')+(LANGS.some(l=>l[0]===sel)?'':`<option selected>${esc(sel)}</option>`);
function openWord(fid,wid){
  if(!S.user&&!S.guest){toast('Sign in first');return}
  if(!canEdit()){toast('Only the admin can edit the official library',1);return}
  if(!fl().length){toast('Create a language first');openLang();return}
  const f=fF(fid)||fF(S.fid)||fl()[0],w=wid&&fW(f,wid);
  const def=LANGS.some(l=>l[0]===f.name)?f.name:LANGS[0][0];
  S.modal={t:'word',fid:f.id,wid,mode:w&&((w.tr||[]).length>1||(w.ex||[]).length||w.pron||w.notes||(w.tags||[]).length)?'full':'quick',err:{},
   d:w?{term:w.term,tr:[...trs(w)],ex:(w.ex||[]).length?[...w.ex]:[''],pron:w.pron||'',notes:w.notes||'',tags:(w.tags||[]).join(', '),sub:w.sub||'',from:w.from||def,to:w.to||'Spanish'}:{term:'',tr:[''],ex:[''],pron:'',notes:'',tags:'',sub:f.id===S.fid&&f.subs.includes(S.sub)?S.sub:'',from:def,to:def==='Spanish'?'English':'Spanish'}};
  if(!(S.modal.d.tr.length))S.modal.d.tr=[''];renderModal()}
function wordModal(){
  const m=S.modal,d=m.d,full=m.mode==='full',e=m.err,f=fF(m.fid);if(d.sub&&!f.subs.includes(d.sub))d.sub='';
  const rows=(k,ph)=>d[k].map((v,i)=>`<div class="row" style="margin-bottom:6px"><input class="m_${k}" value="${esc(v)}" placeholder="${ph} ${i+1}" ${k==='tr'&&i===0?'autofocus':''}>${d[k].length>1?`<button type="button" class="ib" aria-label="Remove" onclick="rowDel('${k}',${i})">${ic('x')}</button>`:''}</div>`).join('');
  return `<div class="ov" onmousedown="if(event.target===this){S.modal=null;renderModal()}"><div class="md" role="dialog" aria-label="Word">
  <div class="row" style="justify-content:space-between"><h2>${m.wid?'Edit word':'Add word'}</h2><button class="ib" aria-label="Close" onclick="S.modal=null;renderModal()">${ic('x')}</button></div>
  <div class="tabs"><button class="${full?'':'on'}" onclick="setMode('quick')">Quick add</button><button class="${full?'on':''}" onclick="setMode('full')">Full card</button></div>
  <div class="two"><div><label>Language</label><select id="m_fid" onchange="collect();renderModal()">${fl().map(x=>`<option value="${x.id}" ${x.id===m.fid?'selected':''}>${esc(x.native)}</option>`).join('')}</select></div>
  <div><label>Subfolder</label><select id="m_sub"><option value="">None</option>${f.subs.map(s=>`<option value="${esc(s)}" ${s===d.sub?'selected':''}>${esc(s)}</option>`).join('')}</select></div></div>
  ${full?`<div class="two"><div><label>Original language</label><select id="m_from">${lopts(d.from)}</select></div><div><label>Translation language</label><select id="m_to">${lopts(d.to)}</select></div></div>`:''}
  <label>Word</label><input id="m_term" value="${esc(d.term)}" placeholder="Word or expression" ${m.wid?'':'autofocus'}>${e.term?`<div class="err">${e.term}</div>`:''}
  <label>${full?'Translations':'Translation'}</label>${full?rows('tr','Translation'):`<input class="m_tr" value="${esc(d.tr[0])}" placeholder="Meaning">`}${e.tr?`<div class="err">${e.tr}</div>`:''}
  ${full?`<button type="button" class="gh" onclick="rowAdd('tr')">${ic('plus')}Another translation</button>
  <label>Examples</label>${rows('ex','Example')}<button type="button" class="gh" onclick="rowAdd('ex')">${ic('plus')}Another example</button>
  <label>Pronunciation</label><input id="m_pron" value="${esc(d.pron)}" placeholder="e.g. chow">
  <label>Tags (separated by commas)</label><input id="m_tags" value="${esc(d.tags)}" placeholder="verb, food"><label>Notes</label><textarea id="m_notes" rows="2">${esc(d.notes)}</textarea>`:''}
  <div class="row end"><button class="gh" onclick="S.modal=null;renderModal()">Cancel</button><button class="pri" onclick="saveWord()">${m.wid?'Save changes':'Save word'}</button></div></div></div>`}
function collect(){
  const m=S.modal,d=m.d,g=id=>{const e=$('#'+id);return e?e.value:null},qa=c=>[...document.querySelectorAll(c)].map(e=>e.value);
  const v=g('m_term');if(v!==null)d.term=v;
  const tr=qa('.m_tr');if(m.mode==='quick'){if(tr.length)d.tr[0]=tr[0]}else if(tr.length)d.tr=tr;
  const ex=qa('.m_ex');if(ex.length)d.ex=ex;
  ['pron','notes','tags','sub','from','to'].forEach(k=>{const x=g('m_'+k);if(x!==null)d[k]=x});
  const f=g('m_fid');if(f)m.fid=f}
function setMode(x){collect();S.modal.mode=x;renderModal()}
function rowAdd(k){collect();S.modal.d[k].push('');renderModal();const a=document.querySelectorAll('.m_'+k);a[a.length-1].focus()}
function rowDel(k,i){collect();const a=S.modal.d[k];a.splice(i,1);if(!a.length)a.push('');renderModal()}
function saveWord(){
  collect();const m=S.modal,d=m.d,term=d.term.trim(),tr=d.tr.map(s=>s.trim()).filter(Boolean),f=fF(m.fid);m.err={};
  if(!term)m.err.term='Enter the word';else if(ws(f).some(w=>w.id!==m.wid&&w.term.toLowerCase()===term.toLowerCase()))m.err.term='Already exists in this language';
  if(!tr.length)m.err.tr='Add at least one translation';
  if(Object.keys(m.err).length){renderModal();return}
  if(d.sub&&!f.subs.includes(d.sub))d.sub='';
  const o={term,meaning:tr[0],tr,ex:d.ex.map(s=>s.trim()).filter(Boolean),pron:d.pron.trim(),notes:d.notes.trim(),tags:d.tags.split(',').map(s=>s.trim()).filter(Boolean),sub:d.sub,from:d.from,to:d.to};
  let old=f;if(m.wid){old=fl().find(x=>fW(x,m.wid));const w=fW(old,m.wid);Object.assign(w,o);if(old!==f){old.words=old.words.filter(x=>x!==w);f.words.unshift(w)}}
  else f.words.unshift({id:uid(),at:Date.now(),learned:false,...o});
  S.modal=null;renderModal();persist(...new Set([f,old]));renderMain();toast(m.wid?'Changes saved':'Word saved')}
function openLang(id){if(!S.user&&!S.guest){toast('Sign in first');return}if(!canEdit()){toast('Only the admin can edit the official library',1);return}const f=id&&fF(id);S.menu=null;S.modal={t:'lang',fid:id,err:'',d:f?{name:f.name,native:f.native,color:f.color}:{name:'',native:'',color:COLORS[fl().length%COLORS.length]}};renderModal()}
function langModal(){const m=S.modal,d=m.d;
  return `<div class="ov" onmousedown="if(event.target===this){S.modal=null;renderModal()}"><div class="md sm" role="dialog" aria-label="Language"><h2>${m.fid?'Edit language':'New language'}</h2>
  <label>Name (in English)</label><input id="l_name" list="ll" value="${esc(d.name)}" placeholder="e.g. Italian" onchange="langAuto()" autofocus><datalist id="ll">${LANGS.map(l=>`<option value="${l[0]}">`).join('')}</datalist>
  <label>Native name</label><input id="l_native" value="${esc(d.native)}" placeholder="e.g. Italiano, 粵語, Русский">${m.err?`<div class="err">${m.err}</div>`:''}
  <label>Color</label><div class="cols">${COLORS.map(c=>`<button class="sw ${c===d.color?'on':''}" style="--c:${c}" aria-label="Color ${c}" onclick="lcol('${c}')"></button>`).join('')}<input type="color" value="${/^#[0-9a-f]{6}$/i.test(d.color)?d.color:'#9caf88'}" aria-label="Custom color" title="Custom color" onchange="lcol(this.value)"></div>
  <div class="row end"><button class="gh" onclick="S.modal=null;renderModal()">Cancel</button><button class="pri" onclick="saveLang()">Save</button></div></div></div>`}
function lcollect(){S.modal.d.name=$('#l_name').value;S.modal.d.native=$('#l_native').value}
function langAuto(){const n=$('#l_name').value.trim(),l=LANGS.find(x=>x[0].toLowerCase()===n.toLowerCase());if(l&&!$('#l_native').value.trim())$('#l_native').value=l[1]}
function lcol(c){lcollect();S.modal.d.color=c;renderModal()}
function saveLang(){lcollect();const m=S.modal,d=m.d,name=d.name.trim(),nat=d.native.trim()||name;
  if(!name){m.err='Enter the language name';renderModal();return}
  let f;if(m.fid){f=fF(m.fid);Object.assign(f,{name,native:nat,color:d.color})}else{f={id:uid(),name,native:nat,color:d.color,words:[],subs:[]};D().folders.push(f)}
  S.modal=null;renderModal();persist(f);render();toast(m.fid?'Language updated':'Language created')}
init();
